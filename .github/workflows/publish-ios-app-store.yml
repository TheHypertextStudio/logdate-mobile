name: Publish iOS
run-name: Publish iOS ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches: [main]
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      track:
        description: Distribution track
        type: choice
        default: testflight
        options: [testflight, app-store]

permissions:
  contents: read

concurrency:
  group: publish-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    uses: ./.github/workflows/studio-route.yml
    permissions:
      actions: read
      contents: read

  publish-internal:
    name: Upload to TestFlight Internal
    if: >
      vars.LOGDATE_IOS_INTERNAL_PUBLISH_ENABLED == 'true'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'workflow_dispatch'
      )
    needs: [route]
    runs-on: ${{ needs.route.outputs.macos == 'studio' && fromJSON('{"group":"studio-macos","labels":["self-hosted","macOS","ARM64","studio-macos"]}') || 'macos-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Materialize iOS Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          ios-google-service-info-plist-base64: ${{ secrets.LOGDATE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ios-firebase-app-id: ${{ vars.LOGDATE_FIREBASE_IOS_APP_ID }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_RELEASE }}

      - name: Resolve iOS version
        id: version
        run: ./scripts/resolve-ios-app-version.sh

      - name: Install signing
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: ./scripts/install-ios-signing.sh

      - name: Render ExportOptions.plist with installed profile UUID
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :provisioningProfiles:studio.hypertext.apps.logdate $LOGDATE_IOS_PROVISIONING_PROFILE_UUID" \
            iosApp/Configuration/ExportOptions.plist

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Compose Multiplatform iOS framework (release)
        run: ./gradlew :app:compose-main:linkPodReleaseFrameworkIosArm64

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -archivePath build/iosApp.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates NO

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/iosApp.xcarchive \
            -exportOptionsPlist iosApp/Configuration/ExportOptions.plist \
            -exportPath build/export

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          xcrun altool --upload-app \
            --type ios \
            --file build/export/iosApp.ipa \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER"

      - name: Upload archive + .ipa as artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-internal-${{ steps.version.outputs.current_project_version }}
          if-no-files-found: warn
          path: |
            build/iosApp.xcarchive
            build/export/iosApp.ipa

  publish-production:
    name: Submit to App Store review
    if: >
      vars.LOGDATE_IOS_PRODUCTION_PUBLISH_ENABLED == 'true'
      && startsWith(github.ref, 'refs/tags/ios-v')
    environment: ios-production
    needs: [route]
    runs-on: ${{ needs.route.outputs.macos == 'studio' && fromJSON('{"group":"studio-macos","labels":["self-hosted","macOS","ARM64","studio-macos"]}') || 'macos-latest' }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Materialize iOS Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          ios-google-service-info-plist-base64: ${{ secrets.LOGDATE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ios-firebase-app-id: ${{ vars.LOGDATE_FIREBASE_IOS_APP_ID }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_RELEASE }}

      - name: Resolve iOS version
        id: version
        run: ./scripts/resolve-ios-app-version.sh

      - name: Install signing
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: ./scripts/install-ios-signing.sh

      - name: Render ExportOptions.plist with installed profile UUID
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :provisioningProfiles:studio.hypertext.apps.logdate $LOGDATE_IOS_PROVISIONING_PROFILE_UUID" \
            iosApp/Configuration/ExportOptions.plist

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.ref_type != 'tag' }}

      - name: Build Compose Multiplatform iOS framework (release)
        run: ./gradlew :app:compose-main:linkPodReleaseFrameworkIosArm64

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -archivePath build/iosApp.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates NO

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/iosApp.xcarchive \
            -exportOptionsPlist iosApp/Configuration/ExportOptions.plist \
            -exportPath build/export

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          xcrun altool --upload-app \
            --type ios \
            --file build/export/iosApp.ipa \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER"

      - name: Submit for App Store review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_BUNDLE_ID: studio.hypertext.apps.logdate
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.current_project_version }}
        run: ./scripts/submit-ios-for-review.sh

      - name: Upload archive + .ipa as artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-production-${{ steps.version.outputs.marketing_version }}
          if-no-files-found: warn
          path: |
            build/iosApp.xcarchive
            build/export/iosApp.ipa

      - name: Draft GitHub Release with iOS .ipa
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --generate-notes \
            --title "iOS ${{ steps.version.outputs.marketing_version }} (${{ steps.version.outputs.current_project_version }})" \
            build/export/iosApp.ipa
